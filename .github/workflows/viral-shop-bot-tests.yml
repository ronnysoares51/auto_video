name: Viral Shop Bot checks
on:
  push:
    paths:
      - 'viral-shop-bot/**'
      - '.github/workflows/viral-shop-bot-tests.yml'
  pull_request:
    paths:
      - 'viral-shop-bot/**'
      - '.github/workflows/viral-shop-bot-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viral-shop-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
